name: Rust protocol and WASM checks

on:
  pull_request:
  push:
    branches:
      - systems/**

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Check browser WASM target
        run: cargo check -p eaglerrust-client --target wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build browser package
        working-directory: crates/client
        run: wasm-pack build --target web --release --out-dir ../../web/pkg

      - name: Validate browser worker and page module syntax
        run: |
          node --check web/singleplayer-worker.js
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text()
          marker = '<script type="module">'
          start = html.index(marker) + len(marker)
          end = html.index("</script>", start)
          Path("/tmp/eaglerrust-page.mjs").write_text(html[start:end])
          PY
          node --check /tmp/eaglerrust-page.mjs
