<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <title>EaglerRust 26.3</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d16;
      color: #edf2ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(42, 92, 150, .22), transparent 55%),
        #090d16;
    }

    main { width: min(1040px, 100%); }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #31577f;
      border-radius: 11px;
      background: #14243a;
      color: #8cc8ff;
      font-weight: 800;
    }

    h1 { margin: 0; font-size: clamp(1.2rem, 3vw, 1.65rem); letter-spacing: -.04em; }
    .version { color: #8494ac; font-size: .78rem; margin-top: 3px; }

    .pill {
      padding: 7px 10px;
      border: 1px solid #263b54;
      border-radius: 999px;
      color: #a9c9e8;
      background: rgba(16, 29, 46, .8);
      font: 600 .7rem ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .08em;
    }

    .screen {
      overflow: hidden;
      border: 1px solid #26364d;
      border-radius: 18px;
      background: #0b1422;
      box-shadow: 0 24px 90px rgba(0, 0, 0, .38);
    }

    .screen-head {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 42px;
      padding: 0 15px;
      border-bottom: 1px solid #1c2b40;
      color: #8093ad;
      font: .72rem ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .dot { width: 7px; height: 7px; border-radius: 50%; background: #38516e; }
    .screen-head span:last-child { margin-left: auto; }

    #game-canvas {
      display: block;
      width: 100%;
      height: auto;
      min-height: 320px;
      aspect-ratio: 16 / 9;
      background: #0a1423;
      outline: none;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 18px;
      border-top: 1px solid #1c2b40;
      color: #8ea0b8;
      font-size: .82rem;
      line-height: 1.5;
    }

    #status { color: #b7d9f8; }
    .hint { text-align: right; }

    @media (max-width: 600px) {
      body { padding: 14px; }
      .pill { display: none; }
      .bottom { flex-direction: column; gap: 5px; }
      .hint { text-align: left; }
      #game-canvas { min-height: 240px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topline">
      <div class="brand">
        <div class="mark" aria-hidden="true">ER</div>
        <div>
          <h1>EaglerRust</h1>
          <div class="version">26.3 · Rust + WebAssembly</div>
        </div>
      </div>
      <div class="pill">ENGINE / DEV BUILD</div>
    </header>

    <section class="screen" aria-label="Game viewport">
      <div class="screen-head">
        <i class="dot"></i><i class="dot"></i><i class="dot"></i>
        <span>renderer.viewport</span>
        <span>WEBGL1 / VOXELS</span>
      </div>
      <canvas id="game-canvas" aria-label="EaglerRust game viewport"></canvas>
      <div class="bottom">
        <div id="status" role="status">Starting Rust runtime…</div>
        <div class="hint">WASD move · Space/Shift rise & descend · drag to look</div>
      </div>
    </section>
  </main>

  <script type="module">
    import init, {
      boot,
      start_renderer,
      resize_renderer,
      draw_frame,
      set_key,
      look
    } from "./pkg/eaglerrust_client.js";

    const status = document.querySelector("#status");
    const canvasId = "game-canvas";

    try {
      await init();
      boot();
      start_renderer(canvasId);
      status.textContent = "World ready · WASD + pointer-look enabled";

      const movementKeys = new Set(["w", "a", "s", "d", " ", "shift", "control"]);
      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (movementKeys.has(key)) {
          event.preventDefault();
          set_key(key, true);
        }
      });
      window.addEventListener("keyup", (event) => {
        const key = event.key.toLowerCase();
        if (movementKeys.has(key)) {
          event.preventDefault();
          set_key(key, false);
        }
      });
      window.addEventListener("blur", () => {
        for (const key of movementKeys) set_key(key, false);
      });

      let activePointer = null;
      let lastX = 0;
      let lastY = 0;
      canvas.addEventListener("pointerdown", (event) => {
        activePointer = event.pointerId;
        lastX = event.clientX;
        lastY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
        if (event.pointerType === "mouse" && canvas.requestPointerLock) {
          canvas.requestPointerLock();
        }
      });
      canvas.addEventListener("pointermove", (event) => {
        if (event.pointerType === "mouse" && document.pointerLockElement === canvas) {
          look(event.movementX, event.movementY);
          return;
        }
        if (activePointer === event.pointerId) {
          look(event.clientX - lastX, event.clientY - lastY);
          lastX = event.clientX;
          lastY = event.clientY;
        }
      });
      const stopPointer = (event) => {
        if (activePointer === event.pointerId) activePointer = null;
      };
      canvas.addEventListener("pointerup", stopPointer);
      canvas.addEventListener("pointercancel", stopPointer);

      window.addEventListener("resize", () => {
        try {
          resize_renderer(canvasId);
          draw_frame();
        } catch (error) {
          status.textContent = `Resize hiccup: ${error}`;
        }
      });

      const frame = () => {
        draw_frame();
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    } catch (error) {
      console.error("EaglerRust failed to start:", error);
      status.textContent = `Startup failed: ${error}`;
    }
  </script>
</body>
</html>
