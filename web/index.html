<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <title>EaglerRust 26.3</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d16;
      color: #edf2ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(42, 92, 150, .22), transparent 55%),
        #090d16;
    }

    main { width: min(1040px, 100%); }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #31577f;
      border-radius: 11px;
      background: #14243a;
      color: #8cc8ff;
      font-weight: 800;
    }

    h1 { margin: 0; font-size: clamp(1.2rem, 3vw, 1.65rem); letter-spacing: -.04em; }
    .version { color: #8494ac; font-size: .78rem; margin-top: 3px; }

    .pill {
      padding: 7px 10px;
      border: 1px solid #263b54;
      border-radius: 999px;
      color: #a9c9e8;
      background: rgba(16, 29, 46, .8);
      font: 600 .7rem ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .08em;
    }

    .screen {
      overflow: hidden;
      border: 1px solid #26364d;
      border-radius: 18px;
      background: #0b1422;
      box-shadow: 0 24px 90px rgba(0, 0, 0, .38);
    }

    .screen-head {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 42px;
      padding: 0 15px;
      border-bottom: 1px solid #1c2b40;
      color: #8093ad;
      font: .72rem ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .dot { width: 7px; height: 7px; border-radius: 50%; background: #38516e; }
    .screen-head span:last-child { margin-left: auto; }

    .viewport-wrap { position: relative; }

    #game-canvas {
      display: block;
      touch-action: none;
      width: 100%;
      height: auto;
      min-height: 320px;
      aspect-ratio: 16 / 9;
      background: #0a1423;
      outline: none;
    }

    .mobile-controls {
      display: none;
      position: absolute;
      inset: auto 12px 12px;
      justify-content: space-between;
      align-items: end;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .mobile-pad, .mobile-actions {
      display: grid;
      gap: 7px;
      pointer-events: auto;
    }

    .mobile-pad {
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
    }

    .mobile-actions {
      grid-template-columns: repeat(2, 44px);
      align-items: end;
    }

    .mobile-controls button {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid rgba(185, 215, 245, .48);
      border-radius: 13px;
      background: rgba(12, 27, 45, .76);
      color: #edf6ff;
      font: 700 1rem ui-sans-serif, system-ui, sans-serif;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .mobile-controls button:active,
    .mobile-controls button.is-pressed {
      background: rgba(58, 117, 170, .9);
      border-color: #a8d7ff;
    }

    .mobile-pad [data-key="w"] { grid-column: 2; grid-row: 1; }
    .mobile-pad [data-key="a"] { grid-column: 1; grid-row: 2; }
    .mobile-pad [data-key="s"] { grid-column: 2; grid-row: 2; }
    .mobile-pad [data-key="d"] { grid-column: 3; grid-row: 2; }

    .mobile-actions button { font-size: .72rem; }

    @media (hover: none) and (pointer: coarse), (max-width: 760px) {
      .mobile-controls { display: flex; }
      #game-canvas { min-height: 300px; }
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 18px;
      border-top: 1px solid #1c2b40;
      color: #8ea0b8;
      font-size: .82rem;
      line-height: 1.5;
    }

    #status { color: #b7d9f8; }
    .hint { text-align: right; }

    @media (max-width: 600px) {
      body { padding: 14px; }
      .pill { display: none; }
      .bottom { flex-direction: column; gap: 5px; }
      .hint { text-align: left; }
      #game-canvas { min-height: 240px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topline">
      <div class="brand">
        <div class="mark" aria-hidden="true">ER</div>
        <div>
          <h1>EaglerRust</h1>
          <div class="version">26.3 · Rust + WebAssembly</div>
        </div>
      </div>
      <div class="pill">ENGINE / DEV BUILD</div>
    </header>

    <section class="screen" aria-label="Game viewport">
      <div class="screen-head">
        <i class="dot"></i><i class="dot"></i><i class="dot"></i>
        <span>renderer.viewport</span>
        <span>WEBGL1 / VOXELS</span>
      </div>
      <div class="viewport-wrap">
        <canvas id="game-canvas" aria-label="EaglerRust game viewport"></canvas>
        <div id="hotbar" class="hotbar" aria-label="Prototype nine-slot hotbar"></div>\n        <div class="mobile-controls" aria-label="Touch movement controls">
          <div class="mobile-pad">
            <button type="button" data-key="w" aria-label="Move forward">▲</button>
            <button type="button" data-key="a" aria-label="Move left">◀</button>
            <button type="button" data-key="s" aria-label="Move backward">▼</button>
            <button type="button" data-key="d" aria-label="Move right">▶</button>
          </div>
          <div class="mobile-actions">
            <button type="button" data-key=" " aria-label="Move up">UP</button>
            <button type="button" data-key="shift" aria-label="Move down">DOWN</button>
            <button type="button" data-key="control" aria-label="Move faster">FAST</button>
          </div>
        </div>
      </div>
      <div class="bottom">
        <div id="status" role="status">Starting Rust runtime…</div>
        <div class="hint">WASD or touch pad · drag to look · UP/DOWN to fly</div>
      </div>
    </section>
  </main>

  <script type="module">
    import init, {
      boot,
      start_renderer,
      resize_renderer,
      draw_frame,
      set_key,
      look
    } from "./pkg/eaglerrust_client.js";

    const status = document.querySelector("#status");
    const canvasId = "game-canvas";
    const canvas = document.getElementById(canvasId);

    try {
      await init();
      boot();
      start_renderer(canvasId);
      status.textContent = "World ready · browser hotbar connected";

      // The visible nine-slot HUD reads and updates the Rust Hotbar model.
      const hotbarRoot = document.getElementById("hotbar");
      const blockNames = ["Empty", "Grass", "Dirt", "Stone", "Water", "Sand", "Log", "Leaves"];
      const blockColors = ["transparent", "#63ad48", "#8a6546", "#9da3aa", "#287db8", "#d8c47e", "#79502e", "#39864a"];
      for (let slot = 0; slot < 9; slot++) {
        const button = document.createElement("button");
        button.type = "button"; button.className = "hotbar-slot"; button.dataset.slot = String(slot);
        button.setAttribute("aria-label", `Select hotbar slot ${slot + 1}`);
        button.addEventListener("click", () => { select_hotbar_slot(slot); refreshHotbar(); });
        hotbarRoot.append(button);
      }
      function refreshHotbar() {
        const selected = selected_hotbar_slot();
        [...hotbarRoot.children].forEach((button, slot) => {
          const item = hotbar_item(slot); const count = hotbar_count(slot);
          button.classList.toggle("selected", slot === selected); button.innerHTML = "";
          const swatch = document.createElement("span"); swatch.className = "swatch";
          swatch.style.background = blockColors[item] || "transparent";
          const label = document.createElement("span"); label.textContent = blockNames[item] || "Block";
          const amount = document.createElement("span"); amount.textContent = count ? String(count) : "";
          button.append(swatch, label, amount);
        });
      }
      refreshHotbar();
      window.addEventListener("keydown", (event) => {
        if (/^[1-9]$/.test(event.key)) { select_hotbar_slot(Number(event.key) - 1); refreshHotbar(); }
      });

      const movementKeys = new Set(["w", "a", "s", "d", " ", "shift", "control"]);
      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (movementKeys.has(key)) {
          event.preventDefault();
          set_key(key, true);
        }
      });
      window.addEventListener("keyup", (event) => {
        const key = event.key.toLowerCase();
        if (movementKeys.has(key)) {
          event.preventDefault();
          set_key(key, false);
        }
      });
      window.addEventListener("blur", () => {
        for (const key of movementKeys) set_key(key, false);
        document.querySelectorAll(".mobile-controls button.is-pressed").forEach((button) => {
          button.classList.remove("is-pressed");
        });
      });

      // Touch buttons mirror keyboard input and keep each held key in Rust.
      document.querySelectorAll(".mobile-controls button[data-key]").forEach((button) => {
        const key = button.dataset.key;
        const press = (event) => {
          event.preventDefault();
          button.setPointerCapture?.(event.pointerId);
          button.classList.add("is-pressed");
          set_key(key, true);
        };
        const release = (event) => {
          event.preventDefault();
          button.classList.remove("is-pressed");
          set_key(key, false);
        };
        button.addEventListener("pointerdown", press);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
        button.addEventListener("contextmenu", (event) => event.preventDefault());
      });

      let activePointer = null;
      let lastX = 0;
      let lastY = 0;
      canvas.addEventListener("pointerdown", (event) => {
        activePointer = event.pointerId;
        lastX = event.clientX;
        lastY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
        if (event.pointerType === "mouse" && canvas.requestPointerLock) {
          canvas.requestPointerLock();
        }
      });
      canvas.addEventListener("pointermove", (event) => {
        if (event.pointerType === "mouse" && document.pointerLockElement === canvas) {
          look(event.movementX, event.movementY);
          return;
        }
        if (activePointer === event.pointerId) {
          look(event.clientX - lastX, event.clientY - lastY);
          lastX = event.clientX;
          lastY = event.clientY;
        }
      });
      const stopPointer = (event) => {
        if (activePointer === event.pointerId) activePointer = null;
      };
      canvas.addEventListener("pointerup", stopPointer);
      canvas.addEventListener("pointercancel", stopPointer);

      window.addEventListener("resize", () => {
        try {
          resize_renderer(canvasId);
          draw_frame();
        } catch (error) {
          status.textContent = `Resize hiccup: ${error}`;
        }
      });

      const frame = () => {
        draw_frame();
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    } catch (error) {
      console.error("EaglerRust failed to start:", error);
      status.textContent = `Startup failed: ${error}`;
    }
  </script>
</body>
</html>
