<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>EaglerRust 26.3</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; }
    main { width: min(42rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #374151; border-radius: 1rem; background: #1f2937; }
    h1 { margin-top: 0; } p { line-height: 1.6; color: #d1d5db; }
    #status { padding: .8rem; border-radius: .5rem; background: #111827; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>EaglerRust 26.3</h1>
    <p>Rust + WebAssembly application shell.</p>
    <p id="status" role="status">Loading WebAssembly…</p>
  </main>
  <script type="module">
    import init, { boot } from "./pkg/eaglerrust_client.js";
    const status = document.querySelector("#status");
    try {
      await init();
      boot();
      status.textContent = "Rust/WASM initialized. Game systems are not ported yet.";
    } catch (error) {
      console.error(error);
      status.textContent = `WASM startup failed: ${error}`;
    }
  </script>
</body>
</html>
